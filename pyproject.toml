[project]
name = "jev-ultrafast"
version = "0.2.0"
description = "A browser agent that chooses instead of generating."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["browser-harness==0.1.13", "httpx[http2]>=0.28,<1"]

[project.scripts]
jev = "jev_ultrafast.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1", "pillow>=11,<13"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Model instructions are long prose strings; wrapping them would change the prompts.
"jev_ultrafast/planner.py" = ["E501"]
"jev_ultrafast/capture.py" = ["E501"]
"jev_ultrafast/compare.py" = ["E501"]
