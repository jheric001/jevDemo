<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="demo-token" content="__TOKEN__" />
    <title>Jev 題型實驗室</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      [hidden] { display: none !important; }
      .card { border: 1px solid rgba(0,0,0,.1); border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,.65); margin-top: 12px; }
      .card h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .06em; opacity: .75; font-weight: 600; }
      .field { margin-top: 12px; }
      .field label { display: block; font-size: 12px; letter-spacing: .04em; opacity: .7; margin: 0 0 6px; }
      .field textarea { width: 100%; box-sizing: border-box; font: inherit; line-height: 1.6; padding: 10px 12px; border: 1px solid rgba(0,0,0,.14); border-radius: 10px; background: #fff; }
      .field textarea.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
      .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
      .row .primary { margin-left: auto; }
      .row select { font: inherit; padding: 4px 8px; border: 1px solid rgba(0,0,0,.14); border-radius: 8px; background: #fff; max-width: 100%; }
      .note { font-size: 12px; opacity: .7; margin: 6px 0 0; }
      .focus { font-size: 13px; margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid #f2c14e; background: rgba(242,193,78,.12); border-radius: 0 8px 8px 0; }
      .error { color: #a12a2a; font-size: 13px; margin-top: 10px; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
      .panel.prev { opacity: .72; }
      .panel .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .panel h2 { margin: 0; font-size: 16px; }
      .panel .tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #1f6f6b; color: #fff; white-space: nowrap; }
      .panel.prev .tag { background: rgba(0,0,0,.12); color: #333; }
      .panel .meta { font-size: 12px; opacity: .75; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
      .panel .state { font-size: 12px; opacity: .8; margin: 0 0 6px; padding: 6px 10px; background: rgba(0,0,0,.035); border-radius: 8px; white-space: pre-wrap; max-height: 5.6em; overflow: auto; }
      .q { border-top: 1px solid rgba(0,0,0,.08); padding: 10px 0 4px; }
      .q-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .q-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
      .q-type { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: #f2c14e; color: #3a2700; }
      .q-ins { font-size: 13px; opacity: .8; }
      .q-sum { font-size: 13px; margin: 6px 0 4px; }
      .q-sum b { font-variant-numeric: tabular-nums; }
      .hint { font-size: 12px; opacity: .7; }
      .opt { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 44px; gap: 10px; align-items: center; font-size: 12px; margin: 4px 0; }
      .opt-name { line-height: 1.3; }
      .opt-name small { display: block; opacity: .6; }
      .opt.chosen .opt-name { font-weight: 700; color: #1f6f6b; }
      .track { position: relative; height: 14px; border-radius: 4px; background: rgba(0,0,0,.06); overflow: hidden; }
      .track span { display: block; height: 100%; background: #f2c14e; }
      .opt.chosen .track span { background: #1f6f6b; }
      .track.mid::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px dashed rgba(0,0,0,.45); }
      .opt-val { text-align: right; font-variant-numeric: tabular-nums; }
      @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="首頁" class="brand">Jev <span>題型實驗室</span></a>
      <div class="local"><span class="dot"></span> 本機執行 · <a href="/">網頁搜尋助手</a> · <a href="/compare">三種模式比價</a></div>
    </header>
    <main>
      <section class="intro">
        <div>
          <p class="eyebrow">Choice × Noul × Score</p>
          <h1>貼一段文字，看 Jev 怎麼選</h1>
          <p>
            從題庫挑一題，或自己貼文字、改問題。按「執行」後，所有問題一次送給 Jev 平行回答。
            右邊會留著上一次的結果，換一句話再跑，就能並排看數字怎麼動。
          </p>
        </div>
      </section>

      <form id="form" class="card">
        <div class="row">
          <label>題庫 <select id="bank"><option value="">自訂（不套用題庫）</option></select></label>
          <button type="submit" class="primary" id="run">執行</button>
        </div>
        <p id="focus" class="focus" hidden></p>
        <div class="field">
          <label for="state">文字（state）</label>
          <textarea id="state" rows="5"></textarea>
        </div>
        <div class="field">
          <label for="questions">問題（JSON）</label>
          <textarea id="questions" class="code" rows="14" spellcheck="false"></textarea>
          <p class="note">每題要有 type（choice、noul 或 score）和 instructions；choice 的 criteria 是「選項 → 說明」，score 的 criteria 是由低到高的等級陣列。</p>
        </div>
        <p id="error" class="error" hidden></p>
      </form>

      <section class="cols">
        <div class="card panel" id="current" hidden></div>
        <div class="card panel prev" id="previous" hidden></div>
      </section>
    </main>
    <script src="/lab.js"></script>
  </body>
</html>
